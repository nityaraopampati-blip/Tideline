name: Tideline
options:
  bundleIdPrefix: com.tideline
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Tideline:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tideline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tideline.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/Tideline-Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: "Tideline uses your camera to scan barcodes and photograph items so it can tell you how to recycle or reduce plastic use."
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.tideline.app
            CFBundleURLSchemes:
              - tideline
  TidelineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TidelineTests
    dependencies:
      - target: Tideline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tideline.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tideline:
    build:
      targets:
        Tideline: all
    test:
      targets:
        - TidelineTests
